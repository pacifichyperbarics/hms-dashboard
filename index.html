<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#082a3a">
<title>HMS Home v4 — Experimental</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23082a3a'/%3E%3Cpath d='M17 16h8v12h14V16h8v32h-8V36H25v12h-8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tile.openstreetmap.org">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">H</span><div><strong>HMS Home</strong><span>v4 experiment</span></div></div>
    <nav class="primary-nav" aria-label="HMS Home sections">
      <button type="button" class="active" data-view="today"><span class="nav-icon">⌂</span><span>Today</span><b id="attentionCount">3</b></button>
      <button type="button" data-view="work"><span class="nav-icon">✓</span><span>Work</span></button>
      <button type="button" data-view="clinics"><span class="nav-icon">+</span><span>Clinics</span></button>
      <button type="button" data-view="apps"><span class="nav-icon">▦</span><span>Apps</span></button>
      <button type="button" data-view="chat"><span class="nav-icon">◌</span><span>Chat</span></button>
    </nav>
    <div class="side-status">
      <span class="status-dot"></span>
      <div><strong>Prototype data</strong><span>V3 remains the current dashboard</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="eyebrow">Thursday · September 17</p>
        <h1 id="pageTitle">Good morning</h1>
        <p class="subtitle" id="pageSubtitle">Start with decisions, exceptions, and accountable next actions.</p>
      </div>
      <div class="top-actions">
        <span class="prototype-pill">Experimental V4</span>
        <button type="button" class="ask-button" data-open-chat>Ask HMS</button>
      </div>
    </header>
    <div class="freshness"><span></span><b>Preview only</b> · representative HMS data · no live writes</div>
    <section id="viewRoot" aria-live="polite"></section>
  </main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button type="button" class="active" data-view="today"><span>⌂</span>Today</button>
    <button type="button" data-view="work"><span>✓</span>Work</button>
    <button type="button" data-view="clinics"><span>+</span>Clinics</button>
    <button type="button" data-view="apps"><span>▦</span>Apps</button>
    <button type="button" data-view="chat"><span>◌</span>Chat</button>
  </nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="./data.js"></script>
<script src="./map.js"></script>
<script src="./app.js"></script>
</body>
</html>
