name: AgentMail Signup Once

on:
  push:
    paths:
      - '.github/workflows/agentmail-signup-once.yml'

permissions:
  contents: write

jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create AgentMail account
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST 'https://api.agentmail.to/agent/sign-up' \
            -H 'Content-Type: application/json' \
            -d '{"human_email":"info@pacifichyperbarics.com","username":"pacific-referral","source":"chatgpt","referrer":"hms-referral-dashboard"}' \
            -o response.json
          openssl smime -encrypt -binary -aes-256-cbc \
            -in response.json \
            -outform DER \
            -out agentmail-signup-response.der \
            .github/agentmail-setup-public.crt
          rm -f response.json
      - name: Commit encrypted response
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agentmail-signup-response.der
          git commit -m 'Store encrypted AgentMail signup response'
          git push
